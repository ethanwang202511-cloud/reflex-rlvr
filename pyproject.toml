[project]
name = "reflex-rlvr"
version = "0.1.0a0"
description = "REFLEX-RLVR: self-teacher capacity expansion via latent-register exploration and Latent-to-Discrete Policy Transfer (LDPT)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ethan Wang" }]
keywords = ["rlvr", "latent-reasoning", "self-distillation", "reasoning-llm"]

dependencies = [
    "numpy>=1.26",
    "sympy>=1.13",
    "torch>=2.4",
    "antlr4-python3-runtime==4.11",  # required by sympy.parse_latex
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
modal = [
    "modal>=1.4",
    "wandb>=0.18",
    "transformers>=4.45",
    "accelerate>=0.34",
    "peft>=0.13",
    "vllm>=0.6",
    "trl>=0.10",
    "datasets>=3.0",
    "sae-lens>=4.0",
    "hydra-core>=1.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PL", "RUF"]
ignore = ["E501", "PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
